<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeGuard AI - Video Inspection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .upload-area {
            border: 2px dashed #007bff;
            border-radius: 15px;
            padding: 50px;
            text-align: center;
            background: #f8f9fa;
            transition: 0.3s;
        }
        .upload-area:hover { border-color: #0056b3; background: #e9f5ff; }
        .video-result { max-width: 100%; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .detection-item { background: #e7f3ff; padding: 10px; border-radius: 8px; margin: 8px 0; border-left: 4px solid #007bff; }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('employee_index') }}"><i class="fas fa-shield-alt"></i> PipeGuard AI</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('employee_index') }}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <h1 class="text-center mb-4">Video Inspection</h1>
        <p class="text-center text-muted mb-5">Upload a video of pipeline or infrastructure for AI-powered anomaly detection.</p>

        <!-- Upload Section -->
        <div id="uploadSection" class="text-center">
            <div class="upload-area" onclick="document.getElementById('videoInput').click()">
                <i class="fas fa-video fa-4x text-primary mb-3"></i>
                <h4>Click or Drop Video Here</h4>
                <p class="text-muted">MP4 only • Max 200MB • Up to 2 minutes recommended</p>
                <input type="file" id="videoInput" accept="video/mp4" style="display:none;">
            </div>
            <div id="previewSection" class="mt-4 d-none">
                <video id="previewVideo" controls class="w-75 video-result"></video>
                <p class="mt-2">File: <strong id="fileName"></strong></p>
                <button id="analyzeBtn" class="btn btn-primary btn-lg mt-3">
                    <i class="fas fa-play me-2"></i>Start Analysis
                </button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="mt-5 d-none">
            <h2 class="text-center mb-4">Analysis Results</h2>
            <div class="row">
                <div class="col-md-6">
                    <h5>Original Video</h5>
                    <video controls class="video-result w-100" id="originalVideo"></video>
                </div>
                <div class="col-md-6">
                    <h5>Detected Anomalies Video</h5>
                    <video controls class="video-result w-100" id="detectedVideo"></video>
                </div>
            </div>
            <div class="mt-4">
                <h5>Detection Summary</h5>
                <div id="detectionList"></div>
            </div>
            <div class="text-center mt-4">
                <button class="btn btn-secondary" onclick="location.reload()">Analyze Another Video</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let selectedFile = null;

        document.getElementById('videoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type === 'video/mp4' && file.size < 200 * 1024 * 1024) {
                selectedFile = file;
                const preview = document.getElementById('previewVideo');
                preview.src = URL.createObjectURL(file);
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('previewSection').classList.remove('d-none');
            } else {
                alert('Please upload an MP4 video under 200MB.');
            }
        });

        document.getElementById('analyzeBtn').addEventListener('click', async function() {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            this.disabled = true;
            this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing Video...';

            try {
                const response = await fetch('{{ url_for("video_predict") }}', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Analysis failed');

                const result = await response.json();

                // Reload original video
                const originalVideo = document.getElementById('originalVideo');
                originalVideo.src = URL.createObjectURL(selectedFile);
                originalVideo.load();

                // Reload detected anomalies video
                const detectedVideo = document.getElementById('detectedVideo');
                detectedVideo.src = result.detected;   // e.g. /static/results/result_20251127_210200.mp4?t=...
                detectedVideo.load();

                // Show detections
                const list = document.getElementById('detectionList');
                list.innerHTML = '';
                if (result.detections.length === 0) {
                    list.innerHTML = '<p class="text-success">No anomalies detected!</p>';
                } else {
                    result.detections.forEach(d => {
                        list.innerHTML += `<div class="detection-item"><strong>${d.class}</strong>: ${d.confidence}% (Frame ${d.frame})</div>`;
                    });
                }

                document.getElementById('uploadSection').classList.add('d-none');
                document.getElementById('resultsSection').classList.remove('d-none');
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                this.disabled = false;
                this.innerHTML = '<i class="fas fa-play me-2"></i>Start Analysis';
            }
        });
    </script>
</body>
</html>
