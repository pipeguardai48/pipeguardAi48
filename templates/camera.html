<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PipeGuard AI - Live Camera Inspection</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body { background:#f8f9fa; }

.camera-container {
    max-width: 800px;
    margin:auto;
    padding:20px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,.1);
}

canvas {
    width:100%;
    border-radius:8px;
    border:2px solid #dee2e6;
}

.detections-list {
    max-height:200px;
    overflow-y:auto;
    background:#f8f9fa;
    padding:10px;
    border-radius:8px;
    margin-top:15px;
}

.detection-item {
    border-bottom:1px solid #ddd;
    padding:5px 0;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark fixed-top">
<div class="container">
<span class="navbar-brand">PipeGuard AI</span>
<a href="/index" class="text-white">Back</a>
</div>
</nav>

<section class="py-5 mt-5">
<div class="container">
<h2 class="text-center mb-4">Live Camera Inspection</h2>

<div class="camera-container">

<canvas id="canvas"></canvas>
<video id="video" autoplay playsinline style="display:none;"></video>

<div class="text-center mt-3">
<button id="startBtn" class="btn btn-success me-2">
<i class="fas fa-play"></i> Start
</button>
<button id="stopBtn" class="btn btn-danger" disabled>
<i class="fas fa-stop"></i> Stop
</button>
</div>

<div class="detections-list" id="detections">
<h5>Detections</h5>
</div>

</div>
</div>
</section>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const detectionsDiv = document.getElementById('detections');

let stream;
let running = false;
let predictionTimer = null;
let lastAnnotatedImage = null;

// INIT CAMERA (REAR)
async function initCamera() {
    stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } }
    });
    video.srcObject = stream;
    await video.play();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
}

// 🔁 SMOOTH VIDEO LOOP (60 FPS)
function drawVideo() {
    if (!running) return;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // draw YOLO overlay if exists
    if (lastAnnotatedImage) {
        ctx.drawImage(lastAnnotatedImage, 0, 0, canvas.width, canvas.height);
    }

    requestAnimationFrame(drawVideo);
}

// 🧠 YOLO PREDICTION (EVERY 4s)
function startPredictionLoop() {
    predictionTimer = setInterval(captureAndPredict, 4000);
}

function captureAndPredict() {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    tempCanvas.getContext('2d').drawImage(video, 0, 0);

    tempCanvas.toBlob(async blob => {
        const formData = new FormData();
        formData.append('file', blob, 'frame.jpg');

        try {
            const res = await fetch('/predict', {
                method: 'POST',
                body: formData
            });
            if (!res.ok) return;

            const result = await res.json();

            // Store YOLO overlay
            const img = new Image();
            img.src = `data:image/jpeg;base64,${result.detected}`;
            img.onload = () => lastAnnotatedImage = img;

            // Update detections
            detectionsDiv.innerHTML = '<h5>Detections</h5>';
            (result.detections || []).forEach(d => {
                detectionsDiv.innerHTML += `
                <div class="detection-item">
                    <strong>${d.class}</strong> (${d.confidence}%)
                </div>`;
            });

        } catch (e) {
            console.error(e);
        }
    }, 'image/jpeg', 0.8);
}

// ▶ START
document.getElementById('startBtn').onclick = () => {
    running = true;
    drawVideo();
    startPredictionLoop();
    startBtn.disabled = true;
    stopBtn.disabled = false;
};

// ⏹ STOP
document.getElementById('stopBtn').onclick = () => {
    running = false;
    clearInterval(predictionTimer);
    lastAnnotatedImage = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
};

window.onload = initCamera;
</script>

</body>
</html>
